"zh-Hant":{"back":"回到完整時間線","home":"回5號店首頁","source":"這篇查了什麼？","series":"鐵路一村故事","year":"2018 → 2021","title":"從保溫到修復，鐵路一村怎麼被留下來","description":"從2018年基地修繕維護，到2021年文創小舖進入施工；透過園區工程紀錄板，看鐵路一村如何一步一步被留下來。","paragraphs":[["不是從零開始，而是先把時間留下來","今天走進苗栗火車頭園區，遊客先看見火車、月台與鐵道風景；但這片空間的轉型並不是突然出現的。更早以前，鐵路一村先做了一件很重要的事：把還留在宿舍裡的生活痕跡保存下來。"],["2018：基地修繕維護","苗栗縣政府資料指出，基地在2018年4月啟動基礎修繕與維護，盡可能保留紅磚牆、隔間、灶台、廁所與洗手台。本篇把這段稱為「保溫」，是方便理解的策展語言；官方用語是基地修繕維護。"],["2021：真正走進修復現場","園區留存的工程紀錄板顯示，2021年8月25日，文創小舖仍保留修復前街廓、紅磚牆與室內格局；同年9月至12月，工程進入拆除、結構整理與施工。今天的樣子，是一段一段被留下來的。"]],"captionBefore":"翻拍自園區現場「A1鐵路一村－文創小舖」工程紀錄板；僅調整方向、透視、亮度及清晰度，未補造原始內容。紀錄日期：2021/08/25。","captionWork":"翻拍自園區現場「A1鐵路一村－文創小舖」工程紀錄板；僅調整方向、透視、亮度及清晰度，未補造原始內容。紀錄日期：2021/09/18、2021/12/9。","noteTitle":"為什麼要把2018與2021分開？","note":"2018說的是保存與基地修繕維護的起點；兩張照片則是2021年的實際施工紀錄。分開標示，才不會把不同階段誤寫成同一年。","disclaimer":"本文由5號店依公開史料與園區現場工程紀錄板整理，不是園區官方公告。原始拍攝／製作單位仍在查證；最新開放資訊請以園區公告為準。"},
"en":{"back":"Back to the full timeline","home":"Back to Nara Select","source":"Sources checked","series":"Railway Village Stories","year":"2018 → 2021","title":"From safeguarding to restoration: how Railway Village was retained","description":"Follow Railway Village from basic safeguarding in 2018 to restoration work documented in 2021.","paragraphs":[["Keeping time before rebuilding","The railway scenery visitors see today did not appear overnight. The first priority was to retain traces of everyday life inside the former railway residences."],["2018: basic safeguarding","Miaoli County records say basic repair and maintenance began in April 2018, retaining brick walls, partitions, stoves, toilets and sinks where possible. “Warming” is an editorial phrase; the official wording is basic site repair and maintenance."],["2021: restoration on site","A park record board shows the future creative shops before work on 25 August 2021. From September to December, demolition, structural preparation and construction followed. The village reached today one careful stage at a time."]],"captionBefore":"Rephotographed from the on-site A1 Railway Village record board. Rotation, perspective, brightness and clarity were adjusted without inventing content. Record date: 2021/08/25.","captionWork":"Rephotographed from the on-site construction record board. Rotation, perspective, brightness and clarity were adjusted without inventing content. Record dates: 2021/09/18 and 2021/12/9.","noteTitle":"Why separate 2018 from 2021?","note":"2018 marks the start of safeguarding and maintenance; these images document actual construction in 2021. Keeping the dates separate prevents different stages from becoming one event.","disclaimer":"Compiled by Nara Select from public records and an on-site project board; this is not an official park notice. The original photographer or production unit is still being verified."},
"th":{"back":"กลับไปดูไทม์ไลน์","home":"กลับหน้า Nara Select","source":"แหล่งข้อมูล","series":"เรื่องราวหมู่บ้านรถไฟ","year":"2018 → 2021","title":"จากการเก็บรักษาสู่การบูรณะ หมู่บ้านรถไฟถูกเก็บไว้อย่างไร","description":"จากการซ่อมบำรุงปี 2018 สู่การก่อสร้างที่บันทึกไว้ในปี 2021","paragraphs":[["เก็บร่องรอยเวลาก่อนสร้างใหม่","ภาพสวนรถไฟในวันนี้ไม่ได้เกิดขึ้นข้ามคืน ขั้นแรกคือการรักษาร่องรอยชีวิตในบ้านพักพนักงานรถไฟเดิมไว้"],["2018: ซ่อมบำรุงพื้นฐาน","ข้อมูลของเทศมณฑลเหมียวลี่ระบุว่าเริ่มซ่อมและดูแลพื้นที่ในเดือนเมษายน 2018 โดยพยายามเก็บผนังอิฐ ห้องกั้น เตา ห้องน้ำ และอ่างล้างไว้ คำว่า “เก็บความอุ่น” เป็นภาษาบรรณาธิการ ส่วนคำทางการคือการซ่อมบำรุงพื้นที่"],["2021: เข้าสู่การบูรณะจริง","ป้ายบันทึกหน้างานแสดงสภาพก่อนก่อสร้างเมื่อ 25 สิงหาคม 2021 และงานรื้อ จัดโครงสร้าง และก่อสร้างตั้งแต่กันยายนถึงธันวาคม หมู่บ้านจึงค่อย ๆ มาถึงภาพปัจจุบัน"]],"captionBefore":"ถ่ายสำเนาจากป้ายบันทึก A1 ในสวน ปรับเฉพาะทิศทาง มุมมอง ความสว่าง และความชัด ไม่ได้สร้างเนื้อหาเพิ่ม วันที่ 2021/08/25","captionWork":"ถ่ายสำเนาจากป้ายก่อสร้างในสวน ปรับเฉพาะทิศทาง มุมมอง ความสว่าง และความชัด ไม่ได้สร้างเนื้อหาเพิ่ม วันที่ 2021/09/18 และ 2021/12/9","noteTitle":"ทำไมต้องแยกปี 2018 กับ 2021?","note":"ปี 2018 คือจุดเริ่มการดูแลพื้นที่ ส่วนภาพสองภาพเป็นหลักฐานการก่อสร้างในปี 2021 การแยกวันที่ช่วยไม่ให้เขียนคนละช่วงเป็นปีเดียวกัน","disclaimer":"Nara Select เรียบเรียงจากข้อมูลสาธารณะและป้ายบันทึกในสวน ไม่ใช่ประกาศทางการ หน่วยงานผู้ถ่ายหรือจัดทำเดิมยังอยู่ระหว่างตรวจสอบ"},
"vi":{"back":"Về dòng thời gian","home":"Về Nara Select","source":"Nguồn kiểm chứng","series":"Chuyện Làng Đường sắt","year":"2018 → 2021","title":"Từ gìn giữ đến trùng tu: Làng Đường sắt đã được lưu lại thế nào","description":"Từ bảo trì nền tảng năm 2018 đến công trường được ghi lại trong năm 2021.","paragraphs":[["Giữ lại thời gian trước khi xây mới","Khung cảnh đường sắt hôm nay không xuất hiện chỉ sau một đêm. Bước đầu tiên là lưu lại dấu vết sinh hoạt trong khu nhà cũ của nhân viên đường sắt."],["2018: bảo trì nền tảng","Hồ sơ huyện Miêu Lật cho biết sửa chữa và bảo trì bắt đầu vào tháng 4/2018, cố gắng giữ tường gạch, vách ngăn, bếp, nhà vệ sinh và bồn rửa. “Giữ ấm” là cách gọi biên tập; thuật ngữ chính thức là sửa chữa và bảo trì khu đất."],["2021: bước vào công trường","Bảng ghi tại chỗ cho thấy dãy nhà trước thi công ngày 25/8/2021; từ tháng 9 đến tháng 12 là các giai đoạn tháo dỡ, chỉnh kết cấu và xây dựng. Làng Đường sắt được giữ lại từng bước một."]],"captionBefore":"Chụp lại bảng ghi A1 tại công viên; chỉ chỉnh hướng, phối cảnh, độ sáng và độ rõ, không tạo thêm nội dung. Ngày 2021/08/25.","captionWork":"Chụp lại bảng thi công tại công viên; chỉ chỉnh hướng, phối cảnh, độ sáng và độ rõ, không tạo thêm nội dung. Ngày 2021/09/18 và 2021/12/9.","noteTitle":"Vì sao tách năm 2018 và 2021?","note":"Năm 2018 là điểm bắt đầu gìn giữ và bảo trì; hai ảnh ghi lại thi công thực tế năm 2021. Tách mốc giúp tránh gộp các giai đoạn khác nhau.","disclaimer":"Nara Select tổng hợp từ tư liệu công khai và bảng ghi tại công viên; đây không phải thông báo chính thức. Đơn vị chụp hoặc thực hiện ban đầu vẫn đang được xác minh."},
