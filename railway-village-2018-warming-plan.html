"zh-Hant":{"back":"回到完整時間線","home":"回5號店首頁","source":"這篇查了什麼？","series":"鐵路一村故事","year":"2018 → 2021","title":"從保溫到修復，鐵路一村怎麼被留下來","description":"從2018年基地修繕維護，到2021年文創小舖進入施工；透過園區工程紀錄板，看鐵路一村如何一步一步被留下來。","paragraphs":[["不是從零開始，而是先把時間留下來","今天走進苗栗火車頭園區，遊客先看見火車、月台與鐵道風景；但這片空間的轉型並不是突然出現的。更早以前，鐵路一村先做了一件很重要的事：把還留在宿舍裡的生活痕跡保存下來。"],["2018：基地修繕維護","苗栗縣政府資料指出，基地在2018年4月啟動基礎修繕與維護，盡可能保留紅磚牆、隔間、灶台、廁所與洗手台。本篇把這段稱為「保溫」，是方便理解的策展語言；官方用語是基地修繕維護。"],["2021：真正走進修復現場","園區留存的工程紀錄板顯示，2021年8月25日，文創小舖仍保留修復前街廓、紅磚牆與室內格局；同年9月至12月，工程進入拆除、結構整理與施工。今天的樣子，是一段一段被留下來的。"]],"captionBefore":"翻拍自園區現場「A1鐵路一村－文創小舖」工程紀錄板；僅調整方向、透視、亮度及清晰度，未補造原始內容。紀錄日期：2021/08/25。","captionWork":"翻拍自園區現場「A1鐵路一村－文創小舖」工程紀錄板；僅調整方向、透視、亮度及清晰度，未補造原始內容。紀錄日期：2021/09/18、2021/12/9。","noteTitle":"為什麼要把2018與2021分開？","note":"2018說的是保存與基地修繕維護的起點；兩張照片則是2021年的實際施工紀錄。分開標示，才不會把不同階段誤寫成同一年。","disclaimer":"本文由5號店依公開史料與園區現場工程紀錄板整理，不是園區官方公告。原始拍攝／製作單位仍在查證；最新開放資訊請以園區公告為準。"},

function render(lang){const d=DATA[lang];document.documentElement.lang=lang;document.title=d.title+'｜'+d.series+'｜5號店';document.querySelector('meta[name="description"]').content=d.description;['series','year','title','captionBefore','captionWork','noteTitle','note','disclaimer'].forEach(k=>document.getElementById(k).textContent=d[k]);document.getElementById('sourceTitle').textContent=d.source;document.getElementById('back').textContent=d.back;document.getElementById('home').textContent=d.home;document.getElementById('paragraphs').innerHTML=d.paragraphs.map((p,i)=>'<section><h2>'+p[0]+'</h2><p class="'+(i===0?'lead':'')+'">'+p[1]+'</p></section>').join('');document.getElementById('lang').value=lang;document.querySelectorAll('.internal').forEach(a=>{const u=new URL(a.href,location.origin);if(lang==='zh-Hant')u.searchParams.delete('lang');else u.searchParams.set('lang',lang);a.href=u.pathname+u.search});localStorage.setItem('nara-lang',lang)}
render(pick());document.getElementById('lang').addEventListener('change',e=>{const u=new URL(location.href);if(e.target.value==='zh-Hant')u.searchParams.delete('lang');else u.searchParams.set('lang',e.target.value);history.replaceState({},'',u);render(e.target.value)});
</script><script src="/assets/site-tracking.js" defer></script>
