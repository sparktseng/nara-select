name: Refresh Miaoli station timetable
on:
  workflow_dispatch:
  schedule:
    - cron: '20 16,20 * * *'
permissions:
  contents: write
concurrency:
  group: miaoli-schedule-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch seven days from official TRA schedule
        run: python3 train-watch/publish_timetable.py --data train-watch/schedule-days.json
      - name: Save public timetable data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add train-watch/schedule-days.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Miaoli station daily timetable data'
          git pull --rebase origin main
          git push origin HEAD:main
