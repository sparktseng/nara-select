name: Miaoli pass-through beta validation

on:
  pull_request:
    paths:
      - 'train-watch/build_pass_through_beta.py'
      - 'train-watch/publish_timetable.py'
      - 'train-watch/pass-through-beta.html'
      - '.github/workflows/train-watch-pass-through-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: |
          python -m py_compile train-watch/build_pass_through_beta.py
          python -m py_compile train-watch/publish_timetable.py
      - name: Validate conservative model invariants
        run: |
          python - <<'PY'
          import importlib.util, pathlib
          p=pathlib.Path('train-watch/build_pass_through_beta.py')
          spec=importlib.util.spec_from_file_location('beta',p)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          assert m.CALIBRATION[('111','2026-10-01')]['observed']=='09:21:00'
          assert m.CALIBRATION[('110','2026-10-01')]['observed']=='09:36:00'
          assert m.SPECIAL_REFERENCE[('6725','2026-10-03')]['reference']=='12:39:00'
          assert m.SPECIAL_REFERENCE[('6725','2026-10-03')]['official'] is False
          e=m.special_estimate('6725','2026-10-03')
          assert e['from']=='12:35:00' and e['to']=='12:41:00'
          assert m.car_info({'CarClass':'110G'})['vehicleType']=='EMU3000'
          assert m.car_info({'CarClass':'110G'})['traction'] is None
          print('static invariants OK')
          PY
      - name: Integration test against TRA official ODS
        run: |
          python - <<'PY'
          import importlib.util, json, pathlib, re, urllib.request
          spec=importlib.util.spec_from_file_location('beta','train-watch/build_pass_through_beta.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          base='https://ods.railway.gov.tw'
          index=urllib.request.urlopen(base+'/tra-ods-web/ods/download/dataResource/railway_schedule/JSON/list',timeout=30).read().decode('utf-8-sig')
          links=dict((d,u) for u,d in re.findall(r'<a\\s+href="([^"]+)">(\\d{8})\\.json</a>',index))
          def payload(day):
              key=day.replace('-','')
              assert key in links, f'ODS missing {day}'
              req=urllib.request.Request(base+links[key],headers={'User-Agent':'NaraSelect-BetaValidation/1.0'})
              return json.loads(urllib.request.urlopen(req,timeout=40).read().decode('utf-8-sig'))
          d1=m.beta_rows(payload('2026-10-01'),'2026-10-01')
          by1={r['train']:r for r in d1}
          assert '111' in by1, '111 mountain non-stop missing'
          assert '110' in by1, '110 mountain non-stop missing'
          assert by1['111']['vehicleType']=='EMU3000'
          assert by1['111']['kind']=='通過不停'
          # Known coastal Pokemon services must never appear as Miaoli-station pass-through.
          for no in ('1038','2013'):
              assert no not in by1, f'coastal train {no} leaked into Miaoli'
          d3=m.beta_rows(payload('2026-10-03'),'2026-10-03')
          by3={r['train']:r for r in d3}
          assert '6725' in by3, '6725 mountain charter missing'
          assert by3['6725']['kind']=='通過不停'
          assert by3['6725']['externalReference']['official'] is False
          assert by3['6725']['estimate']['from']=='12:35:00'
          assert by3['6725']['estimate']['to']=='12:41:00'
          print('TRA ODS integration OK',len(d1),len(d3))
          PY
      - name: Safety note
        run: echo "Validation only; this workflow does not deploy or modify main."
