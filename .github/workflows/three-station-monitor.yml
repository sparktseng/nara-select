name: TRA Three Station Observations
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/three-station-monitor.yml
      - train-watch/station_monitor.py
      - train-watch/monitor_relay.py
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 225
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: train-watch
      - name: Validate observation and handoff rules
        working-directory: train-watch
        run: python3 -m unittest test_station_monitor.py test_monitor_recovery.py
      - name: Avoid redundant scheduled observers
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 train-watch/monitor_relay.py guard
      - name: Verify immediate authenticated snapshot
        if: steps.gate.outputs.collect == 'true'
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: python3 train-watch/station_monitor.py --samples 1 --output "$RUNNER_TEMP/three-stations-start"
      - name: Preserve immediate verification
        if: always() && steps.gate.outputs.collect == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tra-three-stations-start-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/three-stations-start
          if-no-files-found: warn
          retention-days: 90
      - name: Verify successor dispatch after source changes
        if: always() && steps.gate.outputs.collect == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 train-watch/monitor_relay.py handoff
      - name: Observe minute samples segment 1 of 12
        if: always() && steps.gate.outputs.collect == 'true'
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: python3 train-watch/station_monitor.py --samples 16 --interval 60 --output "$RUNNER_TEMP/three-stations-1"
      - name: Save segment 1
        if: always() && steps.gate.outputs.collect == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tra-three-stations-${{ github.run_id }}-${{ github.run_attempt }}-part01
          path: ${{ runner.temp }}/three-stations-1
          if-no-files-found: warn
          retention-days: 90
      - name: Observe minute samples segment 2 of 12
