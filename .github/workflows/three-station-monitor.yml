name: TRA Three Station Observations
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/three-station-monitor.yml
      - train-watch/station_monitor.py
      - train-watch/monitor_relay.py
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  stop-existing-observers:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel active three-station observations
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          base = 'https://api.github.com/repos/' + os.environ['GH_REPO']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28'}
          def api(path, method='GET'):
              req = Request(base + path, headers=headers, method=method)
              with urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None
          current = int(os.environ['CURRENT_RUN_ID'])
          active = {'queued', 'in_progress', 'waiting', 'pending', 'requested'}
          runs = api('/actions/workflows/three-station-monitor.yml/runs?per_page=100')
          cancelled = []
          for run in runs['workflow_runs']:
              if run['id'] != current and run['status'] in active:
                  api('/actions/runs/' + str(run['id']) + '/force-cancel', 'POST')
                  cancelled.append(run['id'])
          print('Cancelled observation runs:', cancelled)
          print('Scheduled monitoring removed; collection and handoff jobs disabled.')
          PY
  collect:
    # Paused at the user's request on 2026-10-05 after TDX quota exhaustion.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 225
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: train-watch
      - name: Validate observation and handoff rules
        working-directory: train-watch
        run: python3 -m unittest test_station_monitor.py test_monitor_recovery.py
      - name: Avoid redundant scheduled observers
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 train-watch/monitor_relay.py guard
      - name: Verify immediate authenticated snapshot
        if: steps.gate.outputs.collect == 'true'
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: python3 train-watch/station_monitor.py --samples 1 --output "$RUNNER_TEMP/three-stations-start"
      - name: Preserve immediate verification
        if: always() && steps.gate.outputs.collect == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tra-three-stations-start-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/three-stations-start
          if-no-files-found: warn
          retention-days: 90
      - name: Verify successor dispatch after source changes
        if: always() && steps.gate.outputs.collect == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 train-watch/monitor_relay.py handoff
      - name: Observe minute samples segment 1 of 12
        if: always() && steps.gate.outputs.collect == 'true'
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: python3 train-watch/station_monitor.py --samples 16 --interval 60 --output "$RUNNER_TEMP/three-stations-1"
      - name: Save segment 1
        if: always() && steps.gate.outputs.collect == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
