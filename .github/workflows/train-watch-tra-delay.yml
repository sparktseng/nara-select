name: Refresh next-three TRA delays
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'train-watch/tra_delay.py'
      - '.github/workflows/train-watch-tra-delay.yml'
permissions:
  contents: write
concurrency:
  group: miaoli-tra-delay-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify delay parser
        run: python3 -m unittest discover -s train-watch -p test_tra_delay.py
      - name: Fetch only the next three TRA train statuses
        run: python3 train-watch/tra_delay.py
      - name: Save shared snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add train-watch/tra-delay.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update next-three TRA delay snapshot [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
