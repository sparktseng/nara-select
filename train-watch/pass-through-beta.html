<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>苗栗站看火車 Beta｜5號店</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ed;color:#263b35;font-family:system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:22px 16px 48px}a{color:#20594d}h1{font-size:30px;margin:8px 0}.sub{color:#68776f}.notice{background:#fff1d8;border-left:4px solid #b77a1d;padding:12px 14px;border-radius:8px;margin:16px 0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.filters button{border:1px solid #cdd5cf;background:white;border-radius:999px;padding:8px 12px}.filters button.on{background:#263b35;color:white}.list{display:grid;gap:10px}.train{background:white;border:1px solid #dce2dd;border-radius:14px;padding:14px;display:grid;grid-template-columns:90px 1fr;gap:12px}.time{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}.kind{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;display:inline-block}.official{background:#dcefe5;color:#245b40}.estimate{background:#fff0cf;color:#7b5411}.special{background:#fff5bd;color:#675000}.meta{font-size:14px;color:#66746c;margin-top:4px}.name{font-weight:800}.confidence{font-size:12px;color:#7b6a45;margin-top:6px}.traction{font-size:12px;color:#66746c}.beta{font-size:12px;letter-spacing:.08em;color:#8b6322;font-weight:800}@media(max-width:520px){.train{grid-template-columns:82px 1fr}.time{font-size:18px}h1{font-size:27px}}</style></head>
<body><main><a href="../miaoli-trains.html">← 返回目前正式時刻表</a><p class="beta">BETA · 尚未公開</p><h1>苗栗站｜今天看什麼火車？</h1>
<p class="sub">把停靠與過站不停放在同一條時間軸。這個版本只驗收呈現方式，預估通過時間不是臺鐵官方時刻。</p>
<div class="notice"><b>時間怎麼看？</b><br>「官方停靠」＝臺鐵表定苗栗時間；「預估通過」＝依路線、班表與實測資料推估。拍不停靠列車請提早到拍攝位置。</div>
<div class="filters"><button class="on" data-f="all">全部</button><button data-f="pass">只看過站不停</button><button data-f="special">特殊列車</button></div>
<section class="list" id="list"><p class="sub">載入每日資料中…</p></section><h2 id="pendingTitle" hidden>今天還有這些過站列車｜時間校正中</h2><section class="list" id="pending"></section>
<p class="sub" style="margin-top:20px">Beta規則：沒有可靠當日證據，不標E500等牽引機車；海線列車不會因經苗栗縣而列入苗栗站時間軸。</p>
<script>
const list=document.getElementById('list'),pending=document.getElementById('pending'),pendingTitle=document.getElementById('pendingTitle');
const pad=n=>String(n).padStart(2,'0');
function nowTW(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const o=Object.fromEntries(p.map(x=>[x.type,x.value]));return {date:o.year+'-'+o.month+'-'+o.day,time:o.hour+':'+o.minute+':'+o.second};}
function sortTime(x){if(x.kind==='通過不停')return x.estimate?.from||'99:99:99';return x.arrival||x.departure||'99:99:99';}
function card(x){
 const pass=x.kind==='通過不停',special=!!(x.special||x.externalReference?.special);
 const a=document.createElement('article');a.className='train';a.dataset.kind=(pass?'pass ':'')+(special?'special':'official');
 const left=document.createElement('div'),right=document.createElement('div');
 const time=document.createElement('div');time.className='time';
 if(pass&&x.estimate)time.textContent=x.estimate.from.slice(0,5)+'–'+x.estimate.to.slice(0,5);
 else time.textContent=(x.arrival||x.departure||'—').slice(0,5);
 left.append(time);
 const badge=document.createElement('span');badge.className='kind '+(pass?'estimate':'official');badge.textContent=pass?'預估通過':'官方停靠';left.append(badge);
 if(special){const b=document.createElement('span');b.className='kind special';b.textContent='特殊列車';left.append(document.createTextNode(' '),b);}
 const name=document.createElement('div');name.className='name';name.textContent=x.train+'次 · '+(x.vehicleType||x.type||x.serviceType||'車型未確認');right.append(name);
 const meta=document.createElement('div');meta.className='meta';meta.textContent=x.direction+'｜'+(pass?'苗栗不停靠':(x.arrival?'到 '+x.arrival.slice(0,5):'')+(x.departure?'／開 '+x.departure.slice(0,5):''));right.append(meta);
 const tr=document.createElement('div');tr.className='traction';tr.textContent='牽引機車：'+(x.traction||((x.vehicleType||'').startsWith('EMU')?'不適用（電聯車）':'未確認'));right.append(tr);
 const conf=document.createElement('div');conf.className='confidence';conf.textContent=pass?(x.confidence||'模型預估；尚待驗證'):'臺鐵官方苗栗站表定時間';right.append(conf);
 a.append(left,right);return a;
}
async function load(){
 try{
  const r=await fetch('./schedule-days.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('schedule');
  const d=await r.json(),n=nowTW(),stops=d.days?.[n.date]||[],passes=d.passThroughDays?.[n.date]||[];
  const timedPasses=passes.filter(x=>x.timeGrade!=='C'&&x.estimate);
  const pendingPasses=passes.filter(x=>x.timeGrade==='C'||!x.estimate);
  const rows=[...stops,...timedPasses].filter(x=>sortTime(x)>=n.time).sort((a,b)=>sortTime(a).localeCompare(sortTime(b)));
  list.replaceChildren();if(!rows.length){const p=document.createElement('p');p.className='sub';p.textContent='目前沒有可顯示的後續列車。';list.append(p);} else rows.forEach(x=>list.append(card(x)));
  pending.replaceChildren();pendingTitle.hidden=!pendingPasses.length;
  for(const x of pendingPasses){const a=card(x);a.querySelector('.time').textContent='待校正';a.querySelector('.kind').textContent='通過不停';pending.append(a);}
 }catch(e){list.innerHTML='<p class="notice">Beta每日資料尚未產生或載入失敗；正式時刻表不受影響。</p>';}
}
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));b.classList.add('on');const f=b.dataset.f;document.querySelectorAll('.train').forEach(x=>x.hidden=f!=='all'&&!x.dataset.kind.split(' ').includes(f));});
load();
</script>
</main></body></html>
